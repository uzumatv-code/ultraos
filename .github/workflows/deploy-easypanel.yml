# Dispara o deploy no Easypanel (VPS Hostinger) a cada push na branch de produção.
name: Deploy Easypanel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-easypanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Sistema OS
        run: curl -fsS --retry 3 "${{ secrets.EASYPANEL_DEPLOY_URL }}"
